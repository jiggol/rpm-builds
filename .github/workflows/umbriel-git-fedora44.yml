name: Build Umbriel and Portal Nightly RPMs for Fedora 44

on:
  schedule:
    - cron: '31 3 * * *' # 12:31 KST, daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: umbriel-nightly-fedora44
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.upstream.outputs.build }}
      sha: ${{ steps.upstream.outputs.sha }}
      tag: ${{ steps.upstream.outputs.tag }}
      short_sha: ${{ steps.upstream.outputs.short_sha }}
      snapshot: ${{ steps.upstream.outputs.snapshot }}
      portal_sha: ${{ steps.upstream.outputs.portal_sha }}
      portal_snapshot: ${{ steps.upstream.outputs.portal_snapshot }}
    steps:
      - id: upstream
        name: Check latest Umbriel main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api repos/noctalia-dev/umbriel/commits/main --jq .sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          short_sha="${sha:0:12}"
          portal_sha="$(gh api repos/noctalia-dev/xdg-desktop-portal-umbriel/commits/main --jq .sha)"
          [[ "$portal_sha" =~ ^[0-9a-f]{40}$ ]]
          portal_short="${portal_sha:0:12}"
          tag="umbriel-nightly-${short_sha}-portal-${portal_short}"
          date="$(gh api "repos/noctalia-dev/umbriel/commits/$sha" --jq '.commit.committer.date' | cut -c1-10 | tr -d '-')"
          [[ "$date" =~ ^[0-9]{8}$ ]]
          portal_date="$(gh api "repos/noctalia-dev/xdg-desktop-portal-umbriel/commits/$portal_sha" --jq '.commit.committer.date' | cut -c1-10 | tr -d '-')"
          [[ "$portal_date" =~ ^[0-9]{8}$ ]]
          {
            echo "sha=$sha"
            echo "portal_sha=$portal_sha"
            echo "portal_snapshot=git${portal_date}.${portal_short}"
            echo "tag=$tag"
            echo "short_sha=$short_sha"
            echo "snapshot=git${date}.${short_sha}"
          } >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo "Already published $tag"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
            echo "Will build $tag"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM build requirements
        run: |
          set -euo pipefail
          dnf -y install rpm-build rpmdevtools redhat-rpm-config git tar gzip findutils
          dnf -y builddep specs/umbriel-nightly.spec specs/xdg-desktop-portal-umbriel-nightly.spec
      - name: Archive exact upstream commit
        env:
          SOURCE_SHA: ${{ needs.check.outputs.sha }}
          SNAPSHOT: ${{ needs.check.outputs.snapshot }}
          PORTAL_SHA: ${{ needs.check.outputs.portal_sha }}
        run: |
          set -euo pipefail
          topdir="$GITHUB_WORKSPACE/rpmbuild"
          mkdir -p "$topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          git clone --filter=blob:none https://github.com/noctalia-dev/umbriel.git upstream
          git -C upstream checkout --detach "$SOURCE_SHA"
          test "$(git -C upstream rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat upstream/VERSION)" = '0.1.0'
          git -C upstream archive --format=tar --prefix=umbriel-0.1.0/ "$SOURCE_SHA" \
            | gzip -n > "$topdir/SOURCES/umbriel-0.1.0.tar.gz"
          cp specs/umbriel-nightly.spec "$topdir/SPECS/"
          git clone --filter=blob:none https://github.com/noctalia-dev/xdg-desktop-portal-umbriel.git portal-upstream
          git -C portal-upstream checkout --detach "$PORTAL_SHA"
          test "$(git -C portal-upstream rev-parse HEAD)" = "$PORTAL_SHA"
          git -C portal-upstream archive --format=tar --prefix=xdg-desktop-portal-umbriel-0.1.0/ "$PORTAL_SHA" \
            | gzip -n > "$topdir/SOURCES/xdg-desktop-portal-umbriel-0.1.0.tar.gz"
          cp specs/xdg-desktop-portal-umbriel-nightly.spec "$topdir/SPECS/"
          echo "Building commit $SOURCE_SHA ($SNAPSHOT)"
      - name: Build binary RPM and source RPM
        env:
          SNAPSHOT: ${{ needs.check.outputs.snapshot }}
          PORTAL_SNAPSHOT: ${{ needs.check.outputs.portal_snapshot }}
        run: |
          set -euo pipefail
          rpmbuild -ba \
            --define "_topdir $GITHUB_WORKSPACE/rpmbuild" \
            --define "snapshot $SNAPSHOT" \
            "$GITHUB_WORKSPACE/rpmbuild/SPECS/umbriel-nightly.spec"
          rpmbuild -ba \
            --define "_topdir $GITHUB_WORKSPACE/rpmbuild" \
            --define "snapshot $PORTAL_SNAPSHOT" \
            "$GITHUB_WORKSPACE/rpmbuild/SPECS/xdg-desktop-portal-umbriel-nightly.spec"
          rpm -qp --queryformat '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' \
            "$GITHUB_WORKSPACE"/rpmbuild/RPMS/x86_64/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: umbriel-nightly-${{ needs.check.outputs.short_sha }}-fedora44
          path: |
            rpmbuild/RPMS/**/*.rpm
            rpmbuild/SRPMS/*.src.rpm
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: umbriel-nightly-${{ needs.check.outputs.short_sha }}-fedora44
          path: out
      - name: Generate changelog from upstream commits
        uses: actions/github-script@v8
        env:
          PACKAGE_TAG: ${{ needs.check.outputs.tag }}
          UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
          PORTAL_SHA: ${{ needs.check.outputs.portal_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const currentTag = process.env.PACKAGE_TAG;
            const umSha = process.env.UPSTREAM_SHA;
            const portalSha = process.env.PORTAL_SHA;
            const tagPattern = /^umbriel-nightly-([0-9a-f]{12})-portal-([0-9a-f]{12})$/;
          
            const notes = [
              'Unofficial Fedora 44 RPM builds from pinned upstream Git commits.',
              '',
              '- Umbriel: [\`' + umSha.slice(0, 12) + '\`](https://github.com/noctalia-dev/umbriel/commit/' + umSha + ')',
              '- XDG Desktop Portal: [\`' + portalSha.slice(0, 12) + '\`](https://github.com/noctalia-dev/xdg-desktop-portal-umbriel/commit/' + portalSha + ')',
              '',
            ];
          
            let previous = null;
            try {
              const { data: releases } = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
              previous = releases.find(r => !r.draft && r.tag_name !== currentTag && tagPattern.test(r.tag_name)) || null;
            } catch (error) {
              core.warning('Unable to read previous releases: ' + error.message);
            }
            const match = previous && previous.tag_name.match(tagPattern);
            if (previous) {
              notes.push('Compared with [previous Nightly release](' + previous.html_url + ').', '');
            } else {
              notes.push('No previous Umbriel Nightly release was found; commit history comparison is unavailable.', '');
            }
          
            async function addChanges(label, upstreamRepo, base, head) {
              notes.push('## ' + label);
              if (!base) {
                notes.push('Initial tracked release; no previous upstream commit is available.', '');
                return;
              }
              if (head.startsWith(base)) {
                notes.push('No new upstream commits.', '');
                return;
              }
              const compareUrl = 'https://github.com/noctalia-dev/' + upstreamRepo + '/compare/' + base + '...' + head;
              notes.push('[Full upstream comparison](' + compareUrl + ')', '');
              try {
                const commits = [];
                let total = 0;
                let status = '';
                for (let page = 1; page <= 3; page++) {
                  const { data } = await github.rest.repos.compareCommitsWithBasehead({
                    owner: 'noctalia-dev', repo: upstreamRepo,
                    basehead: base + '...' + head, per_page: 100, page,
                  });
                  total = data.total_commits;
                  status = data.status;
                  commits.push(...data.commits);
                  if (commits.length >= total || data.commits.length < 100) break;
                }
                if (status !== 'ahead' && status !== 'identical') {
                  notes.push('**History warning:** upstream comparison status is \`' + status + '\`.', '');
                }
                const groups = new Map([
                  ['Breaking changes', []],
                  ['Features', []],
                  ['Bug fixes', []],
                  ['Performance', []],
                  ['Other changes', []],
                ]);
                for (const commit of commits) {
                  const message = commit.commit.message;
                  const title = message.split(/\r?\n/, 1)[0];
                  if (/^Merge (pull request|branch)\b/i.test(title)) continue;
                  const conventional = title.match(/^([a-z]+)(?:\([^)]+\))?(!)?:\s*/i);
                  const type = conventional ? conventional[1].toLowerCase() : '';
                  const breaking = Boolean(conventional && conventional[2]) || /BREAKING[ -]CHANGE:/i.test(message);
                  const section = breaking ? 'Breaking changes'
                    : type === 'feat' ? 'Features'
                    : type === 'fix' ? 'Bug fixes'
                    : type === 'perf' ? 'Performance' : 'Other changes';
                const cleanTitle = title.replace(/[\[\]`]/g, c => '\\' + c);
                groups.get(section).push('- ' + cleanTitle + ' ([\`' + commit.sha.slice(0, 7) + '\`](' + commit.html_url + '))');
              }
              let shown = 0;
              for (const [section, entries] of groups) {
                if (!entries.length) continue;
                shown += entries.length;
                notes.push('### ' + section, ...entries, '');
              }
              if (!shown) notes.push('No non-merge commits in this comparison.', '');
              if (total > commits.length) {
                notes.push('**Note:** Only ' + commits.length + ' of ' + total + ' commits were returned by the GitHub comparison API. See the full comparison above.', '');
              }
            } catch (error) {
              core.warning('Unable to generate ' + label + ' changelog: ' + error.message);
              notes.push('Could not retrieve the commit list; use the full comparison link above.', '');
            }
          }
          
          await addChanges('Umbriel', 'umbriel', match ? match[1] : null, umSha);
          await addChanges('XDG Desktop Portal', 'xdg-desktop-portal-umbriel', match ? match[2] : null, portalSha);
          fs.writeFileSync('release-notes.md', notes.join('\n') + '\n', 'utf8');
          core.info('Generated release-notes.md from the previous published Nightly release.');
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
          PORTAL_SHA: ${{ needs.check.outputs.portal_sha }}
          PACKAGE_TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -d '' packages < <(find out -type f -name '*.rpm' -print0)
          (( ${#packages[@]} >= 4 )) || { echo 'Expected RPM and SRPM' >&2; exit 1; }
          if gh release view "$PACKAGE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already released $PACKAGE_TAG"
            exit 0
          fi
          gh release create "$PACKAGE_TAG" "${packages[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Umbriel + Portal Nightly for Fedora 44" \
            --notes-file release-notes.md
